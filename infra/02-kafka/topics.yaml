apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: user-service.public.users
  namespace: kafka
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 4
  replicas: 1
  config:
    cleanup.policy: delete
    retention.ms: "86400000"
