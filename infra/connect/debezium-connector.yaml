apiVersion: kafka.strimzi.io/v1
kind: KafkaConnector
metadata:
  name: users-cdc-connector
  namespace: kafka
  labels:
    strimzi.io/cluster: my-connect-cluster
spec:
  class: io.debezium.connector.postgresql.PostgresConnector
  config:
    database.hostname: postgres.my-java-app.svc.cluster.local
    database.port: 5432
    database.user: postgres
    database.password: qwerty
    database.dbname: user_service_db
    topic.prefix: user-service
    plugin.name: pgoutput
    publication.name: dbz_users_publication
    slot.name: debezium_users_slot
    table.include.list: public.users
    snapshot.mode: initial
    transforms: unwrap
    transforms.unwrap.type: io.debezium.transforms.ExtractNewRecordState
    transforms.unwrap.drop.tombstones: "false"
    transforms.unwrap.delete.handling.mode: rewrite
    transforms.unwrap.add.fields: op
    transforms.unwrap.add.fields.prefix: __