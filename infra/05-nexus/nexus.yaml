apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: my-java-app
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus
  namespace: my-java-app
  labels:
    app: nexus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexus
  template:
    metadata:
      labels:
        app: nexus
    spec:
      containers:
        - name: nexus
          image: sonatype/nexus3:3.68.0
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "1Gi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1"
          volumeMounts:
            - name: nexus-data
              mountPath: /nexus-data
      volumes:
        - name: nexus-data
          persistentVolumeClaim:
            claimName: nexus-data
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: my-java-app
spec:
  type: ClusterIP
  selector:
    app: nexus
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nexus
  namespace: my-java-app
spec:
  host: nexus-my-java-app.apps-crc.testing
  to:
    kind: Service
    name: nexus
    weight: 100
  port:
    targetPort: 8081
  wildcardPolicy: None