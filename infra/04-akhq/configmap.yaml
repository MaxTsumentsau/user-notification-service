apiVersion: v1
kind: ConfigMap
metadata:
  name: akhq-config
  namespace: my-java-app
data:
  application.yml: |
    akhq:
      connections:
        my-cluster:
          properties:
            bootstrap.servers: "my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
          schema-registry:
            url: "http://schema-registry:8081"
            type: "confluent"
          connect:
            - name: "debezium"
              url: "http://user-service:8083"