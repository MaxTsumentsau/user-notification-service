  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: schema-registry
    hostname: schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka-un-1:9092,kafka-un-2:9092,kafka-un-3:9092
      SCHEMA_REGISTRY_AVRO_COMPATIBILITY_LEVEL: backward_transitive
    networks:
      - kafka-un-network
    depends_on:
      - kafka-un-1
      - kafka-un-2
      - kafka-un-3

  debezium-connect:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: debezium-connect
    hostname: debezium-connect
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka-un-1:9092,kafka-un-2:9092,kafka-un-3:9092
      GROUP_ID: debezium-connectors
      CONFIG_STORAGE_TOPIC: debezium_configs
      OFFSET_STORAGE_TOPIC: debezium_offsets
      STATUS_STORAGE_TOPIC: debezium_status
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: io.confluent.connect.avro.AvroConverter
      VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_KEY_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
    networks:
      - kafka-un-network
    depends_on:
      kafka-un-1:
        condition: service_started
      kafka-un-2:
        condition: service_started
      kafka-un-3:
        condition: service_started
      schema-registry:
        condition: service_started
      postgres:
        condition: service_healthy

  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    hostname: akhq
    ports:
      - "9000:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            kafka-un:
              properties:
                bootstrap.servers: "kafka-un-1:9092,kafka-un-2:9092,kafka-un-3:9092"
              schema-registry:
                url: "http://schema-registry:8081"
                type: "confluent"
              connect:
                - name: "debezium"
                  url: "http://debezium-connect:8083"
    networks:
      - kafka-un-network
    depends_on:
      - kafka-un-1
      - kafka-un-2
      - kafka-un-3
      - schema-registry
      - debezium-connect

  connector-registrar:
    image: alpine:latest
    container_name: connector-registrar
    depends_on:
      - debezium-connect
    volumes:
      - ./debezium-users-connector.json:/connector.json:ro
    networks:
      - kafka-un-network
    command: >
      sh -c "
      apk add --no-cache curl jq &&
      echo 'Waiting for Kafka Connect...' &&
      until curl -sf http://debezium-connect:8083/ > /dev/null; do sleep 2; done &&
      echo 'Registering connector...' &&
      jq -c '.config' /connector.json | curl -X PUT -H 'Content-Type: application/json' -d @- http://debezium-connect:8083/connectors/users-cdc-connector/config &&
      echo 'Done!'
      "
    restart: "no"

networks:
  kafka-un-network:
    driver: bridge
    name: kafka-un-network

volumes:
  postgres_data:
  postgres_data_2: