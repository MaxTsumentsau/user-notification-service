type: object
description: Запрос на создание или обновление пользователя
required:
  - name
  - email
properties:
  name:
    type: string
    description: Имя пользователя
    minLength: 1
    example: "Иван"
  email:
    type: string
    format: email
    description: Email пользователя
    minLength: 1
    example: "ivan@example.com"
  age:
    type: integer
    format: int32
    description: Возраст пользователя
    minimum: 0
    nullable: true
    example: 25
