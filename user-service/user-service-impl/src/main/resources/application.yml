spring:
  application:
    name: user-service
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5555/user_service_db
    username: postgres
    password: qwerty
  jpa:
    hibernate:
      ddl-auto: update
